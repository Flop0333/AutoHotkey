<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Speaker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="titlebar" onmousedown="AhkDataService.DragWindow()">
    <span class="titlebar-label">● TEXT SPEAKER</span>
    <button class="titlebar-close" onclick="AhkDataService.StopSpeaking()" title="Close">&times;</button>
  </div>

  <div class="deck">
    <div class="cassette-window">
      <img class="cassette-gif" src="assets/cassette.gif" alt="Cassette tape">
    </div>

    <div class="status-row">
      <span class="led" id="led"></span>
      <span id="status-text">Idle</span>
    </div>

    <div class="transport">
      <button class="btn btn-round" id="restart-btn" title="Restart">⏮</button>
      <button class="btn btn-round btn-primary" id="play-pause-btn" title="Play/Pause">▶</button>
    </div>

    <div class="section">
      <div class="section-label">
        <span>Volume</span>
        <span id="volume-value">100</span>
      </div>
      <input type="range" id="volume-slider" class="slider" min="0" max="100" value="100">
    </div>

    <div class="section">
      <div class="section-label">
        <span>Speed</span>
        <span id="speed-value">1x</span>
      </div>
      <div class="speed-buttons" id="speed-buttons"></div>
    </div>
  </div>

  <script src="AhkDataService.js"></script>
  <script src="index.js"></script>
</body>
</html>
