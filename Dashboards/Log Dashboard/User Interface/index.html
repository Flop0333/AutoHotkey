<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="title-bar">
    <div class="drag-region" onmousedown="ahk.DragWindow()">
      <span class="title-text">Log Dashboard</span>
    </div>
    <div class="title-btn-container">
      <span class="title-btn" onclick="ahk.Minimize()">0</span>
      <span class="title-btn title-btn-maximize" onclick="ahk.Maximize()">1</span>
      <span class="title-btn title-btn-close" onclick="ahk.Close()">r</span>
    </div>
  </div>
  <div class="toolbar">
    <select id="severity-filter"><option value="">All severities</option></select>
    <select id="script-filter"><option value="">All scripts</option></select>
    <button id="sort-time">Time ↓</button>
    <button id="refresh-btn" title="Reload the log file">⟳ Refresh</button>
    <span id="entry-count"></span>
  </div>
  <div class="layout">
    <table id="log-table">
      <thead>
        <tr><th>Time</th><th>Severity</th><th>Script</th><th>Message</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="detail-panel">
      <p class="empty-state">Select a log entry to see details.</p>
    </div>
  </div>
  <script src="index.js"></script>
  <script src="AhkDataService.js"></script>
</body>
</html>
